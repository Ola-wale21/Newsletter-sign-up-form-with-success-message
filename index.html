<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<div class="container">
  <div class="main-image">
    <picture>
      <source srcset="assets/images/illustration-sign-up-desktop.svg" media="(min-width:600px)">
      <img src="assets/images/illustration-sign-up-mobile.svg" alt="list">
    </picture>
  </div>
  <div class="content">
    <h1>Stay updated!</h1>
    <p>Join 60,000+ product managers receiving monthly updates on:</p>
    <div class="features">
      <li><img src="assets/images/icon-list.svg" alt="list"><span>Product discovery and building what matters</span></li>
      <li><img src="assets/images/icon-list.svg" alt="list"><span>Measuring to ensure updates are a success</span></li>
      <li> <img src="assets/images/icon-list.svg" alt="list"><span>And much more!</span></li>
    </div>
    <label for="email"><span>Email address </span><span class="error"></span></label>
    <input type="email" name="email" id="email" placeholder="email@company.com">
    <button id="button">Subscribe to monthly newsletter</button>
  </div>

</div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/Ola-wale21">Olakunle Samuel</a>.
  </div>
  <script src="index.js" charset="UTF-8"></script>
</body>
</html>
